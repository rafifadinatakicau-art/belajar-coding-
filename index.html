            font-family: 'Inter', sans-serif;
        }

        body {
            background-color: var(--bg-dark);
            color: var(--text-main);
            min-height: 100vh;
            background-image: 
                radial-gradient(at 10% 10%, rgba(99, 102, 241, 0.15) 0px, transparent 50%),
                radial-gradient(at 90% 90%, rgba(6, 182, 212, 0.15) 0px, transparent 50%);
            background-attachment: fixed;
            padding-bottom: 50px;
        }

        /* Container Layout */
        .container {

        .profile-card {

            backdrop-filter: blur(16px);

            border: 1px solid var(--card-border);
            border-radius: 24px;
            padding: 40px;
            display: flex;
            align-items: center;
            gap: 35px;
            box-shadow: 0 20px 40px rgba(0, 0, 0, 0.3);
            position: relative;
            overflow: hidden;
        }

        .profile-card::before {
            content: '';
            position: absolute;
            top: 0;
            left: 0;
            width: 6px;
            height: 100%;
            background: linear-gradient(to bottom, var(--primary), var(--secondary));
        }

            position: relative;
            width: 130px;
            height: 130px;
            border-radius: 50%;
            background: linear-gradient(135deg, var(--primary), var(--secondary));
            padding: 4px;
            flex-shrink: 0;
        }

        .profile-avatar img {
            width: 100%;
            height: 100%;
            border-radius: 50%;
            object-fit: cover;
            background: #1e293b;
        }

            font-size: 2.2rem;
            font-weight: 800;

            margin-bottom: 8px;
            letter-spacing: -0.5px;
        }

            margin-bottom: 16px;
        }
